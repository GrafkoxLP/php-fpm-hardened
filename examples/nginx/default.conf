# Minimal nginx config for a PHP application served by php-fpm-hardened.
# Paths must match on both containers (/var/www/html).

server {
    listen 8080;
    server_name _;

    root /var/www/html;
    index index.php;

    server_tokens off;
    client_max_body_size 2m;  # matches post_max_size in the image

    # Never serve dotfiles (.env, .git, ...).
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Only pass existing scripts to PHP-FPM.
        try_files $fastcgi_script_name =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Mitigates httpoxy: never forward a client "Proxy" header.
        fastcgi_param HTTP_PROXY "";
    }
}
