name: Build

on:
  schedule:
    # Daily check whether the official base image has been updated.
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - conf/**
      - tests/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      force:
        description: Build and push even if the base image is unchanged
        type: boolean
        default: false

# Every job declares exactly the permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: docker.io/library/php:8.5-fpm-alpine
  IMAGE: ghcr.io/grafkoxlp/php-fpm-hardened
  MINOR_TAG: "8.5"

jobs:
  check:
    name: Check base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.compare.outputs.build }}
      base_digest: ${{ steps.compare.outputs.base_digest }}
      current_digest: ${{ steps.compare.outputs.current_digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare base digest with published image
        id: compare
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force == true }}
        run: |
          set -euo pipefail

          # Digest of the multi-arch index (manifest list) of the official image.
          base_digest="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ ! "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not determine digest of $BASE_IMAGE (got '$base_digest')"
            exit 1
          fi

          # Base digest recorded in the currently published image, if any.
          # .Image is the image config for a single manifest, or a per-platform map for an index.
          current_digest=""
          if raw="$(docker buildx imagetools inspect "$IMAGE:$MINOR_TAG" --format '{{json .Image}}' 2>/dev/null)"; then
            current_digest="$(jq -r '
              (if has("config") then . else .["linux/amd64"] end)
              | .config.Labels["org.opencontainers.image.base.digest"] // empty' <<<"$raw")"
            image_exists=true
          else
            image_exists=false
          fi

          build=true
          if [[ "$image_exists" != true ]]; then
            reason="published image $IMAGE:$MINOR_TAG not found"
          elif [[ "$current_digest" != "$base_digest" ]]; then
            reason="base digest changed (${current_digest:-none} -> $base_digest)"
          elif [[ "$EVENT" == push ]]; then
            reason="repository changed (push)"
          elif [[ "$FORCE" == true ]]; then
            reason="forced via workflow_dispatch"
          else
            build=false
            reason="base unchanged"
          fi

          echo "Decision: build=$build ($reason)"
          {
            echo "build=$build"
            echo "base_digest=$base_digest"
            echo "current_digest=$current_digest"
          } >> "$GITHUB_OUTPUT"

          if [[ "$build" == true ]]; then
            echo "### Build required: $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Base unchanged (\`$base_digest\`) – skipping build" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build, test and push
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      pushed: ${{ steps.push.outcome == 'success' }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      BASE_DIGEST: ${{ needs.check.outputs.base_digest }}
      OLD_DIGEST: ${{ needs.check.outputs.current_digest }}
      LOCAL_TAG: php-fpm-hardened:ci-${{ github.run_id }}
      # Images are only published from the default branch.
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare build metadata
        id: meta
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image (local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_TAG }}
          # Pin the base by digest so the label always matches the base actually used.
          build-args: |
            PHP_BASE=php:8.5-fpm-alpine@${{ env.BASE_DIGEST }}
          labels: |
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.title=php-fpm-hardened
            org.opencontainers.image.description=Hardened PHP-FPM image (Alpine) with pdo_mysql, rebuilt automatically when the official base image changes
            org.opencontainers.image.licenses=MIT

      - name: Smoke tests
        run: tests/smoke-test.sh "$LOCAL_TAG"

      - name: Determine PHP version
        id: version
        run: |
          set -euo pipefail
          php_version="$(docker run --rm "$LOCAL_TAG" php -r 'echo PHP_VERSION;')"
          if [[ ! "$php_version" =~ ^${MINOR_TAG//./\\.}\.[0-9]+$ ]]; then
            echo "::error::Unexpected PHP version '$php_version'"
            exit 1
          fi
          echo "php_version=$php_version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$MINOR_TAG"
            echo "$IMAGE:$php_version"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push exactly the image that passed the smoke tests.
      - name: Push image
        id: push
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            docker tag "$LOCAL_TAG" "$tag"
            docker push "$tag"
          done <<<"$TAGS"
          digest="$(docker buildx imagetools inspect "$IMAGE:$MINOR_TAG" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not determine digest of pushed image (got '$digest')"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        env:
          PHP_VERSION: ${{ steps.version.outputs.php_version }}
          TAGS: ${{ steps.version.outputs.tags }}
          PUSHED: ${{ steps.push.outcome }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### php-fpm-hardened build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Old base digest | \`${OLD_DIGEST:-none}\` |"
            echo "| New base digest | \`$BASE_DIGEST\` |"
            echo "| PHP version | ${PHP_VERSION:-unknown} |"
            echo "| Pushed | ${PUSHED:-skipped} |"
            if [[ -n "$IMAGE_DIGEST" ]]; then
              echo "| Image digest | \`$IMAGE_DIGEST\` |"
            fi
            echo
            echo "**Tags:**"
            while read -r tag; do
              [[ -n "$tag" ]] && echo "- \`$tag\`"
            done <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs in its own job without write access to packages and without registry
  # credentials on disk, so a compromised scanner cannot push a tampered image.
  scan:
    name: Vulnerability scan
    needs: build
    if: needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Informational only, never blocks a release. The pushed image is scanned by
      # digest straight from the registry; the read-only token covers private packages.
      - name: Trivy scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # GitHub disables scheduled workflows in public repositories after 60 days
  # without repository activity. Re-enabling the workflow via the API resets
  # that timer without the need for dummy commits.
  keepalive:
    name: Keepalive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/enable"
