; Hardening overrides applied on top of php.ini-production.
; Loaded late (zz- prefix) so they win over earlier conf.d files.
; Local overrides belong in a mounted zzz-local.ini, which is loaded after this file.

; Information disclosure: do not advertise the PHP version in the
; X-Powered-By header and never print errors to clients, only log them.
expose_php = Off
display_errors = Off
log_errors = On

; Remote file access: block http:// and similar wrappers in fopen()/include,
; a common building block for SSRF and remote code inclusion.
allow_url_fopen = Off
allow_url_include = Off

; Uploads: disabled entirely to remove the upload attack surface. Upload progress
; tracking is also disabled, which closes the session-upload-progress path used
; by PHP2Shell (CVE-2026-109619).
file_uploads = Off
session.upload_progress.enabled = Off

; Sessions: store in the tmpfs-backed /tmp (the root filesystem is read-only),
; reject uninitialized session IDs and only send cookies over HTTPS,
; unreadable by JavaScript and not on cross-site subrequests.
session.save_path = /tmp
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; Filesystem confinement: scripts may only touch the document root and /tmp.
; Overridable via the PHP_OPEN_BASEDIR environment variable. Note: a variable
; that is set but empty disables open_basedir entirely.
open_basedir = ${PHP_OPEN_BASEDIR:-/var/www/html:/tmp}

; Command execution: remove functions that spawn processes, so a code
; injection cannot be turned into a shell.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Resource limits: cap per-request memory and request body size.
memory_limit = 128M
post_max_size = 2M
